name: Update WordPress.org stats

on:
  schedule:
    - cron: "30 3 * * *" # daily at 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh plugin table
        run: python scripts/update_wporg.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh WordPress.org plugin stats"
          git push
